<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
      .title { font-weight: 700; font-size: 28px; letter-spacing: -0.03em; fill: #ededed; }
      .sub { font-size: 14px; fill: #888888; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .code { font-size: 13px; line-height: 1.6; }
      .red { fill: #f87171; }
      .green { fill: #34d399; }
      .blue { fill: #a855f7; }
      .dim { fill: #52525b; }
      .text-light { fill: #e4e4e7; }
      .amber { fill: #fbbf24; }
    </style>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="480" fill="#000000"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="8" fill="#09090b" stroke="#27272a" stroke-width="1"/>

  <!-- Header Bar -->
  <line x1="20" y1="76" x2="1180" y2="76" stroke="#27272a" stroke-width="1"/>

  <!-- Left Header: Project Identity -->
  <g transform="translate(44, 48)">
    <rect x="0" y="-14" width="22" height="22" rx="4" fill="#a855f7"/>
    <rect x="5" y="-9" width="12" height="12" rx="1" fill="#000000"/>
    <line x1="8" y1="-5" x2="14" y2="-5" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="8" y1="-2" x2="14" y2="-2" stroke="#a855f7" stroke-width="1.5"/>
    <text x="32" y="3" class="mono text-light" font-size="14" font-weight="600">oneroster-csv-validator</text>
    <text x="245" y="3" class="mono dim" font-size="14">/ IMS Global · 1EdTech v1.1/1.2</text>
  </g>

  <!-- Right Header: Status Telemetry -->
  <g transform="translate(1156, 48)">
    <text x="0" y="2" text-anchor="end" class="mono label dim">INTEGRITY AUDIT: <tspan fill="#34d399">ZERO ORPHAN LINKS · BOM CLEAN</tspan></text>
  </g>

  <!-- Split View Dividers -->
  <line x1="600" y1="76" x2="600" y2="416" stroke="#27272a" stroke-width="1"/>
  <line x1="20" y1="416" x2="1180" y2="416" stroke="#27272a" stroke-width="1"/>

  <!-- LEFT PANE: Corrupted Roster Package (Rejected) -->
  <g transform="translate(44, 108)">
    <text x="0" y="0" class="mono label red">CORRUPTED ROSTER EXPORT: FATAL IMPORT ERRORS (REJECTED)</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="red">\xEF\xBB\xBFsourcedId,status,userSourcedId...</tspan></text>
      <text y="24" class="dim">02 <tspan class="dim"># Excel UTF-8 BOM corrupts the first column header!</tspan></text>
      <text y="48" class="dim">03 <tspan class="red"># enrollments.csv references non-existent student:</tspan></text>
      <text y="72" class="dim">04 <tspan class="red">enr_01,cls_math,usr_99999,student  # ORPHAN FOREIGN KEY</tspan></text>
      <text y="96" class="dim">05 <tspan class="dim"># Bulk export contaminated with delta fields:</tspan></text>
      <text y="120" class="dim">06 <tspan class="red">manifest declared "bulk", but rows contain tobedeleted</tspan></text>
      <text y="144" class="dim">07 <tspan class="red">role: "counselor"  # ILLEGAL: Not a valid 1EdTech enum</tspan></text>
      <text y="168" class="dim">08 <tspan class="red">Zip contains: /my_folder/manifest.csv (NESTED ERROR)</tspan></text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <text x="14" y="25" class="mono red" font-size="12">&#x2717; BOM corrupted header | Orphan student link | Clever import fails</text>
    </g>
  </g>

  <!-- RIGHT PANE: Production Validated Roster (Verified) -->
  <g transform="translate(640, 108)">
    <text x="0" y="0" class="mono label green">PRODUCTION: STRICT RELATIONAL INTEGRITY &amp; BOM STRIPPED</text>
    
    <g transform="translate(0, 32)" class="mono code">
      <text y="0" class="dim">01 <tspan class="blue">assert</tspan> manifest.path == "/manifest.csv"  <tspan class="green"># Root level strict</tspan></text>
      <text y="24" class="dim">02 <tspan class="blue">assert</tspan> strip_utf8_bom(raw_bytes)        <tspan class="green"># RFC 4180 clean</tspan></text>
      <text y="48" class="dim">03 <tspan class="dim"># Foreign Key Referential Integrity Check:</tspan></text>
      <text y="72" class="dim">04 <tspan class="green">assert enrollments.userSourcedId in users.sourcedId</tspan></text>
      <text y="96" class="dim">05 <tspan class="green">assert enrollments.classSourcedId in classes.sourcedId</tspan></text>
      <text y="120" class="dim">06 <tspan class="blue">assert</tspan> role in {"administrator", "teacher", "student"}</text>
      <text y="144" class="dim">07 <tspan class="amber">verify_bulk_purity(disallow_delta_columns=True)</tspan></text>
      <text y="168" class="dim">08 <tspan class="green">detect_org_dag_cycles(orgs.csv)  # Zero circular org loops</tspan></text>
    </g>

    <g transform="translate(0, 240)">
      <rect width="510" height="42" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="14" y="25" class="mono green" font-size="12">&#x2713; 100% Referential integrity | Zero orphan links | Clever/SIS ready</text>
    </g>
  </g>

  <!-- Footer Telemetry -->
  <g transform="translate(44, 442)">
    <text class="mono dim" font-size="12">SPEC: <tspan class="text-light">1EdTech OneRoster v1.1 &amp; v1.2 CSV Binding</tspan></text>
    <text x="440" class="mono dim" font-size="12">INTEGRITY: <tspan class="green">Orgs &lt;- Courses &lt;- Classes &lt;- Enrollments -&gt; Users</tspan></text>
    <text x="960" class="mono dim" font-size="12">PARSER: <tspan class="text-light">RFC 4180</tspan></text>
    <text x="1112" text-anchor="end" class="mono green" font-size="12">&#x25CF; SIS READY</text>
  </g>
</svg>
