name: Propose SIS Validation Rule
description: Suggest an additional validation check or vendor-specific rule (Clever, ClassLink)
labels: ["enhancement", "rule"]
body:
  - type: input
    id: rule_name
    attributes:
      label: Rule Title
      placeholder: e.g. Cross-School Enrollment Constraint
    validations:
      required: true
  - type: textarea
    id: specification
    attributes:
      label: Rule Logic & Vendor Reference
      description: Explain the exact logic and why vendor engines reject non-compliant files.
    validations:
      required: true
